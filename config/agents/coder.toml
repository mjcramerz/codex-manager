model = "gpt-5.6-sol"
review_model = "gpt-5.4"
personality = "pragmatic"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "medium"
web_search = "disabled"

developer_instructions = """1) Follow $CODEX_HOME/AGENTS.md, then $CODEX_HOME/memories/ when it exists and the task is repo-aware or ambiguous.
2) Use $CODEX_HOME/INDEX.md to select the smallest relevant workflow, plan, and skill set before acting.
3) Use `$CODEX_HOME/docs/style/shell-runtime.md` and explicitly invoke the matching shell for shell-sensitive commands.
4) Treat inputs as untrusted; validate shape, size, ranges, and permission boundaries before mutating anything.
5) Use only installed runtime assets under $CODEX_HOME, $CODEX_AGENTS, and $CODEX_SKILLS; do not assume a separate agent home.
6) Prefer root-cause fixes, minimal diffs, and implementation details that are easy to verify and review.
7) Preserve behavior unless explicitly requested, avoid destructive actions without confirmation, and leave code paths cleaner, safer, and easier to validate than you found them.
8) Coder role: implement production-ready changes, keep interfaces coherent, and avoid speculative refactors."""

[skills]
config = [
  { path = "${CODEX_SKILLS}", enabled = true },
]

[skills.bundled]
enabled = false

# runtime features
[features]
# sandbox
guardian_approval = false
tool_call_mcp_elicitation = true
elevated_windows_sandbox = false
enable_experimental_windows_sandbox = false
experimental_windows_sandbox = false
default_mode_request_user_input = true
request_permissions = true
request_permissions_tool = true
use_linux_sandbox_bwrap = true
request_rule = false
auth_elicitation = false

# behavior
image_detail_original = false
image_generation = false
fast_mode = false
code_mode = true
memories = false
memory_tool = false
personality = true
child_agents_md = true
multi_agent = true
# legacy alias, replaced by enable_fanout
#spawn_csv = false
enable_fanout = false
remote_models = true
hooks = true

# tools
collab = true
# legacy out-of-schema key retained for traceability
#artifact = false
plugins = true
codex_hooks = true
# legacy out-of-schema key retained for traceability
#powershell_utf8 = false
undo = false
sqlite = false
apply_patch_freeform = true
apply_patch_streaming_events = false
unified_exec = true
apps = true
enable_mcp_apps = true
# legacy out-of-schema key retained for traceability
#apps_mcp_gateway = true
skill_env_var_dependency_prompt = false
skill_mcp_dependency_install = true

# shell
shell_tool = true
shell_snapshot = true
shell_zsh_fork = false
unified_exec_zsh_fork = false

# git
codex_git_commit = false
js_repl = false
js_repl_tools_only = false

# device
realtime_conversation = false
# legacy out-of-schema key retained for traceability
#voice_transcription = false
runtime_metrics = false
enable_request_compression = true
responses_websockets_v2 = true
prevent_idle_sleep = false

[features.multi_agent_v2]
enabled = true
usage_hint_enabled = true
max_concurrent_threads_per_session = 2
min_wait_timeout_ms = 15000
default_wait_timeout_ms = 120000
max_wait_timeout_ms = 300000
root_agent_usage_hint_text = "Use explorer for codebase mapping, hunter for primary-source checks, and reviewer or tester for pre-merge quality gates around substantial implementation work."
subagent_usage_hint_text = "Keep implementation ownership explicit, delegate only supporting discovery or validation slices, and merge child outputs only after checking evidence against the code."
