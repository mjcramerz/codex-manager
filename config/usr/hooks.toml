# hooks
# Keep this file aligned with resources/hooks/scripts/lib/Codex/Hook/HookManifest.toml.

[hooks]
SessionStart = [
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/session_start.pl", statusMessage = "Injecting detected repository context", timeout = 20, type = "command" },
  ], matcher = "^(startup|resume|clear|compact)$" },
]
UserPromptSubmit = [
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/user_prompt_submit.pl", statusMessage = "Injecting detected prompt context", timeout = 20, type = "command" },
  ] },
]
PreCompact = [
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/pre_compact.pl", statusMessage = "Preserving context before compaction", timeout = 20, type = "command" },
  ] },
]
PostCompact = [
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/post_compact.pl", statusMessage = "Re-establishing context after compaction", timeout = 20, type = "command" },
  ] },
]
Stop = [
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/stop.pl", statusMessage = "Checking detected repository constraints", timeout = 25, type = "command" },
  ] },
]
PreToolUse = [
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use_shell.pl", statusMessage = "Checking shell command guardrails", timeout = 25, type = "command" },
  ], matcher = "^(Bash|bash|exec_command|shell)$" },
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use_edit.pl", statusMessage = "Checking edit guardrails", timeout = 20, type = "command" },
  ], matcher = "^(apply_patch|Edit|edit|Write|write)$" },
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use_mcp_openai_developer_docs.pl", statusMessage = "Checking OpenAI docs MCP guardrails", timeout = 20, type = "command" },
  ], matcher = "^mcp__openaiDeveloperDocs__(?:fetch_openai_doc|get_openapi_spec|list_api_endpoints|list_openai_docs|search_openai_docs)$" },
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use_mcp_context7.pl", statusMessage = "Checking Context7 MCP guardrails", timeout = 20, type = "command" },
  ], matcher = "^mcp__context7__(?:resolve-library-id|query-docs)$" },
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use_mcp_filesystem.pl", statusMessage = "Checking filesystem MCP guardrails", timeout = 20, type = "command" },
  ], matcher = "^mcp__filesystem__(?:create_directory|directory_tree|edit_file|get_file_info|list_allowed_directories|list_directory|list_directory_with_sizes|move_file|read_file|read_media_file|read_multiple_files|read_text_file|search_files|write_file)$" },
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use_mcp_fetch.pl", statusMessage = "Checking fetch MCP guardrails", timeout = 20, type = "command" },
  ], matcher = "^mcp__fetch__fetch$" },
