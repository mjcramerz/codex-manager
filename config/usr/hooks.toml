# hooks
# Keep this file aligned with resources/hooks/scripts/lib/Codex/Hook/HookManifest.toml.

[[hooks.SessionStart]]
matcher = "^(startup|resume|clear|compact)$"
hooks = [
  { type = "command", command = "perl ${CODEX_HOME}/hooks/scripts/session_start.pl", timeout = 20, statusMessage = "Injecting detected repository context" },
]

[[hooks.UserPromptSubmit]]
hooks = [
  { type = "command", command = "perl ${CODEX_HOME}/hooks/scripts/user_prompt_submit.pl", timeout = 20, statusMessage = "Injecting detected prompt context" },
]

[[hooks.PreCompact]]
hooks = [
  { type = "command", command = "perl ${CODEX_HOME}/hooks/scripts/pre_compact.pl", timeout = 20, statusMessage = "Preserving context before compaction" },
]

[[hooks.PostCompact]]
hooks = [
  { type = "command", command = "perl ${CODEX_HOME}/hooks/scripts/post_compact.pl", timeout = 20, statusMessage = "Re-establishing context after compaction" },
]

[[hooks.Stop]]
hooks = [
  { type = "command", command = "perl ${CODEX_HOME}/hooks/scripts/stop.pl", timeout = 25, statusMessage = "Checking detected repository constraints" },
]

[[hooks.PreToolUse]]
matcher = "^(apply_patch|Edit|edit|Write|write)$"
hooks = [
  { type = "command", command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use_edit.pl", timeout = 20, statusMessage = "Checking edit guardrails" },
]

[[hooks.PreToolUse]]
