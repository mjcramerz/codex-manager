  ], matcher = "^mcp__(?:chrome-devtools|chrome_devtools)__.+$" },
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use_mcp.pl", statusMessage = "Checking Postgres MCP guardrails", timeout = 20, type = "command" },
