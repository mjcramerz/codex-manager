  ], matcher = "^mcp__" },
  { hooks = [
    { command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use.pl", statusMessage = "Checking generic tool guardrails", timeout = 20, type = "command" },
  ], matcher = "^(?!(?:Bash|bash|exec_command|shell|apply_patch|Edit|edit|Write|write)$)(?!mcp__).+" },
