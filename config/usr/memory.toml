[memories]
disable_on_external_context = false
generate_memories = true
use_memories = true
dedicated_tools = true
workspace_isolation = false
max_raw_memories_for_consolidation = 30
max_unused_days = 4
max_rollout_age_days = 14
max_rollouts_per_startup = 20
min_rollout_idle_hours = 6
min_rate_limit_remaining_percent = 25
max_allowed_taint_level = 1
decay_lambda = 0.05
min_decay_score_to_retain = 0.05
extract_model = "gpt-5.4-mini"
consolidation_model = "gpt-5.4"
phase4_enabled = true
phase4_workspace_entry_limit = 128
phase5_enabled = true
phase5_workspace_rollup_limit = 128

consolidation_instructions_file = "$CODEX_HOME/.models/instructions/memories/consolidation.md"
extraction_instructions_file = "$CODEX_HOME/.models/instructions/memories/extraction.md"
phase4_instructions_file = "$CODEX_HOME/.models/instructions/memories/phase4_selection_ledger.md"
phase5_instructions_file = "$CODEX_HOME/.models/instructions/memories/phase5_phase1_rollups.md"
read_path_instructions_file = "$CODEX_HOME/.models/instructions/memories/read_path.md"
