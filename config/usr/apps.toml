# agents
[agents]
max_threads = 10
max_depth = 2
job_max_runtime_seconds = 5000
interrupt_message = true

# default agents
[agents.default]
description = "Baseline generalist agent for most coding, configuration, and integration tasks with live web-search access."
config_file = "${CODEX_AGENTS}/default.toml"
nickname_candidates = [
  "Atlas",
  "Forge",
]

# manager agents
[agents.manager]
description = "Project manager that owns planning, gating, artifact checks, and multi-agent handoffs."
config_file = "${CODEX_AGENTS}/manager.toml"
nickname_candidates = [
  "North",
  "Ledger",
]

# orchestrator agents
[agents.orchestrator]
description = "Multi-agent runtime orchestrator that manages fan-out, sequencing, wait or close decisions, and reconciliation across child threads."
config_file = "${CODEX_AGENTS}/orchestrator.toml"
nickname_candidates = [
  "Conductor",
  "Vector",
]

# planner agents
[agents.planner]
description = "Front-load planning agent that decomposes ambiguous goals into owned slices, acceptance criteria, and validation gates before delegation."
config_file = "${CODEX_AGENTS}/planner.toml"
nickname_candidates = [
  "Draft",
  "Grid",
]

# delegator agents
[agents.delegator]
description = "Delegation controller that selects roles, packages handoffs, and manages spawn or resume or wait or close flow for subagents."
config_file = "${CODEX_AGENTS}/delegator.toml"
nickname_candidates = [
  "Relay",
  "Broker",
]

# worker agents
[agents.worker]
description = "Scoped delivery agent for bounded tasks with explicit file ownership and tight handoffs."
config_file = "${CODEX_AGENTS}/worker.toml"
nickname_candidates = [
  "Sage",
  "Orbit",
]

# coder agents
[agents.coder]
description = "Implementation-heavy coding agent for complex root-cause fixes and cross-cutting changes."
config_file = "${CODEX_AGENTS}/coder.toml"
nickname_candidates = [
  "Anchor",
  "Helm",
]

# analyst agents
[agents.analyst]
description = "Cross-agent analysis agent that compares child findings, resolves conflicts, and identifies evidence gaps before synthesis."
config_file = "${CODEX_AGENTS}/analyst.toml"
nickname_candidates = [
  "Prism",
  "Delta",
]

# synthesizer agents
[agents.synthesizer]
description = "Synthesis agent that merges completed child outputs into one coherent answer, patch plan, or handoff with provenance."
config_file = "${CODEX_AGENTS}/synthesizer.toml"
nickname_candidates = [
  "Weave",
  "Mosaic",
]

# integrator agents
[agents.integrator]
description = "Read-first integration agent that checks mirror sync and release patch readiness without applying patches."
config_file = "${CODEX_AGENTS}/integrator.toml"
nickname_candidates = [
  "Aegis",
  "Sentinel",
]

# hunter agents
[agents.hunter]
description = "Search-forward research agent for current docs, APIs, runtime behavior, and external evidence."
config_file = "${CODEX_AGENTS}/hunter.toml"
nickname_candidates = [
  "Harbor",
  "Nimbus",
]

# explorer agents
[agents.explorer]
description = "Read-heavy explorer for repository mapping, dependency tracing, and codebase discovery."
config_file = "${CODEX_AGENTS}/explorer.toml"
nickname_candidates = [
  "Beacon",
  "Lens",
]

# reviewer agents
[agents.reviewer]
description = "Review agent for syntax, hardening, functionality, regressions, and best-practice checks."
config_file = "${CODEX_AGENTS}/reviewer.toml"
nickname_candidates = [
  "Signal",
  "Quill",
]

# tester agents
[agents.tester]
description = "Verification agent that reproduces issues, runs targeted tests, and validates completed work."
config_file = "${CODEX_AGENTS}/tester.toml"
nickname_candidates = [
  "Probe",
  "Relay",
]

[hooks]
# installer-only runtime target, not part of the upstream hooks config schema
#managed_dir = "${CODEX_HOME}/hooks"

[[hooks.SessionStart]]
matcher = "^(startup|resume|clear|compact)$"

[[hooks.SessionStart.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/session_start.pl"
timeout = 20
statusMessage = "Injecting detected repository context"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/user_prompt_submit.pl"
timeout = 20
statusMessage = "Injecting detected prompt context"

[[hooks.PreToolUse]]
matcher = "^(Bash|exec_command|shell)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use_shell.pl"
timeout = 25
statusMessage = "Checking shell command guardrails"

[[hooks.PreToolUse]]
matcher = "^(apply_patch|Edit|Write)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use_edit.pl"
timeout = 20
statusMessage = "Checking edit guardrails"

[[hooks.PreToolUse]]
matcher = "^mcp__"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use_mcp.pl"
timeout = 20
statusMessage = "Checking MCP tool guardrails"

[[hooks.PermissionRequest]]
matcher = "^(Bash|exec_command|shell)$"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/permission_request_shell.pl"
timeout = 20
statusMessage = "Checking shell approval scope"

[[hooks.PermissionRequest]]
matcher = "^(apply_patch|Edit|Write)$"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/permission_request_edit.pl"
timeout = 15
statusMessage = "Checking edit approval scope"

[[hooks.PermissionRequest]]
matcher = "^mcp__"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/permission_request_mcp.pl"
timeout = 20
statusMessage = "Checking MCP approval scope"

[[hooks.PostToolUse]]
matcher = "^(Bash|exec_command|shell)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/post_tool_use_shell.pl"
timeout = 20
statusMessage = "Reviewing shell output follow-up"

[[hooks.PostToolUse]]
matcher = "^(apply_patch|Edit|Write)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/post_tool_use_edit.pl"
timeout = 15
statusMessage = "Reviewing edit follow-up"

[[hooks.PostToolUse]]
matcher = "^mcp__"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/post_tool_use_mcp.pl"
timeout = 20
statusMessage = "Reviewing MCP follow-up"

[[hooks.PreCompact]]

[[hooks.PreCompact.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/pre_compact.pl"
timeout = 20
statusMessage = "Preserving context before compaction"

[[hooks.PostCompact]]

[[hooks.PostCompact.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/post_compact.pl"
timeout = 20
statusMessage = "Re-establishing context after compaction"

[[hooks.SubagentStart]]
matcher = '^(default|manager)$'

[[hooks.SubagentStart.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/subagent_start_coordination.pl"
timeout = 20
statusMessage = "Injecting coordination subagent guidance"

[[hooks.SubagentStart]]
matcher = '^orchestrator$'

[[hooks.SubagentStart.hooks]]
