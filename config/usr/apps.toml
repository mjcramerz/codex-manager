# agents
[agents]
max_threads = 10
max_depth = 2
job_max_runtime_seconds = 5000
interrupt_message = true

# default agents
[agents.default]
description = "Baseline generalist agent for most coding, configuration, and integration tasks with live web-search access."
config_file = "${CODEX_AGENTS}/default.toml"
nickname_candidates = [
  "Atlas",
  "Forge",
]

# manager agents
[agents.manager]
description = "Project manager that owns planning, gating, artifact checks, and multi-agent handoffs."
config_file = "${CODEX_AGENTS}/manager.toml"
nickname_candidates = [
  "North",
  "Ledger",
]

# worker agents
[agents.worker]
description = "Scoped delivery agent for bounded tasks with explicit file ownership and tight handoffs."
config_file = "${CODEX_AGENTS}/worker.toml"
nickname_candidates = [
  "Sage",
  "Orbit",
]

# coder agents
[agents.coder]
description = "Implementation-heavy coding agent for complex root-cause fixes and cross-cutting changes."
config_file = "${CODEX_AGENTS}/coder.toml"
nickname_candidates = [
  "Anchor",
  "Helm",
]

# integrator agents
[agents.integrator]
description = "Read-first integration agent that checks mirror sync and release patch readiness without applying patches."
config_file = "${CODEX_AGENTS}/integrator.toml"
nickname_candidates = [
  "Aegis",
  "Sentinel",
]

# hunter agents
[agents.hunter]
description = "Search-forward research agent for current docs, APIs, runtime behavior, and external evidence."
config_file = "${CODEX_AGENTS}/hunter.toml"
nickname_candidates = [
  "Harbor",
  "Nimbus",
]

# explorer agents
[agents.explorer]
description = "Read-heavy explorer for repository mapping, dependency tracing, and codebase discovery."
config_file = "${CODEX_AGENTS}/explorer.toml"
nickname_candidates = [
  "Beacon",
  "Lens",
]

# reviewer agents
[agents.reviewer]
description = "Review agent for syntax, hardening, functionality, regressions, and best-practice checks."
config_file = "${CODEX_AGENTS}/reviewer.toml"
nickname_candidates = [
  "Signal",
  "Quill",
]

# tester agents
[agents.tester]
description = "Verification agent that reproduces issues, runs targeted tests, and validates completed work."
config_file = "${CODEX_AGENTS}/tester.toml"
nickname_candidates = [
  "Probe",
  "Relay",
]

[hooks]
# installer-only runtime target, not part of the upstream hooks config schema
#managed_dir = "${CODEX_HOME}/hooks"

[[hooks.SessionStart]]
matcher = "^(startup|resume)$"

[[hooks.SessionStart.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/session_start.pl"
timeout = 20
statusMessage = "Injecting detected repository context"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/user_prompt_submit.pl"
timeout = 20
statusMessage = "Injecting detected prompt context"

[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/pre_tool_use.pl"
timeout = 20
statusMessage = "Evaluating pre-tool guardrails"

[[hooks.PermissionRequest]]

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/permission_request.pl"
timeout = 20
statusMessage = "Checking permission request scope"

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/post_tool_use.pl"
timeout = 20
statusMessage = "Reviewing post-tool follow-up"

[[hooks.PreCompact]]

[[hooks.PreCompact.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/pre_compact.pl"
timeout = 20
statusMessage = "Preserving context before compaction"

[[hooks.PostCompact]]

[[hooks.PostCompact.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/post_compact.pl"
timeout = 20
statusMessage = "Re-establishing context after compaction"

[[hooks.SubagentStart]]

[[hooks.SubagentStart.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/subagent_start.pl"
timeout = 20
statusMessage = "Injecting subagent role guidance"

[[hooks.SubagentStop]]

[[hooks.SubagentStop.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/subagent_stop.pl"
timeout = 25
statusMessage = "Checking subagent completion gates"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/stop.pl"
timeout = 25
statusMessage = "Checking detected repository constraints"

