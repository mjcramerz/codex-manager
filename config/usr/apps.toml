# apps
#apps_mcp_product_sku = ""
[apps._default]
enabled = true
destructive_enabled = true
open_world_enabled = true

# skills
[skills]
config = [
  { enabled = true, path = "${CODEX_SKILLS}/common" },
  { enabled = true, path = "${CODEX_SKILLS}/audit" },
]
include_instructions = true

[skills.bundled]
enabled = true

