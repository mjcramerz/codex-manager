# context7 - stdio transport
[mcp_servers.context7]
command = "$CODEX_MCP_DIR/wrappers/mcp-context7-wrapper.sh"
# stdio transports must use env_vars; bearer_token_env_var is only valid on url transports.
env_vars = ["CONTEXT7_API_KEY"]
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

