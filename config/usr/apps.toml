[[hooks.SubagentStart.hooks]]
type = "command"
command = "perl ${CODEX_HOME}/hooks/scripts/subagent_start_planning.pl"
timeout = 20
statusMessage = "Injecting planning subagent guidance"

[[hooks.SubagentStart]]
