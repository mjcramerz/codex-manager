[model_providers.openai-custom]
# Managed ChatGPT/Codex-compatible provider profile.
name = "OpenAI (Custom)"
#model = "gpt-5.4"
#model_reasoning_summary = "xhigh"
requires_openai_auth = true
#forced_login_method = "api"
base_url = "https://chatgpt.com/backend-api/codex"
#base_url = "https://api.openai.com/v1"
wire_api = "responses"
query_params = { api_version = "2026-03-11" }
http_headers = { "X-Provider" = "example" }
#env_key = "OPENAI_API_KEY"
env_http_headers = { "OpenAI-Organization" = "OPENAI_ORGANIZATION", "OpenAI-Project" = "OPENAI_PROJECT" }
request_max_retries = 4
stream_max_retries = 3
stream_idle_timeout_ms = 40000
supports_websockets = true
websocket_connect_timeout_ms = 120000

