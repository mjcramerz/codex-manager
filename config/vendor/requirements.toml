# Codex requirements policy template.
# Installed to /etc/codex/requirements.toml by make install/runtime.

# Global allowed runtime policies.
# Global allowed runtime policies.
allowed_approval_policies = [
  {granular = {sandbox_approval = false, rules = false, skill_approval = false, request_permissions = false, mcp_elicitations = false}},
  "untrusted",
  "on-failure",
  "on-request",
  "never"
]
allowed_sandbox_modes = ["read-only", "workspace-write", "danger-full-access", "external-sandbox"]
allowed_web_search_modes = ["disabled", "cached", "live"]
enforce_residency = "us"

# Feature requirements that must stay enabled in managed installs.
allow_managed_hooks_only = false
allowed_approvals_reviewers = ["user", "auto_review"]

[features]
apps = true
hooks = true
plugins = true
memories = true
multi_agent = true
browser_use = true
browser_use_external = true
computer_use = true
in_app_browser = true
plugin_sharing = true
tool_suggest = true
tool_search = true
search_tool = true
enable_mcp_apps = true
skill_mcp_dependency_install = true

# Identity pins for managed MCP servers.
# Each managed MCP requirement supports exactly one identity table:
# - [mcp_servers.<name>.identity].command = "..."
# - [mcp_servers.<name>.identity].url = "..."
