# Command policy rules applied by the runtime guard.
# Supported keys:
# - [rules]
# - prefix_rules = [
#     {
#       pattern = [{ token = "..." }, { any_of = ["...", "..."] }],
#       decision = "prompt" | "forbidden",
#       justification = "...",
#     }
#   ]
# Note: `decision = "allow"` is parsed by Codex but rejected in requirements.toml.
#[rules]
#prefix_rules = [
#  { pattern = [{ token = "rm" }], decision = "forbidden", justification = "block destructive remove" },
#  { pattern = [{ token = "git" }, { any_of = ["push", "commit"] }], decision = "prompt", justification = "require review for SCM mutations" },
#]

