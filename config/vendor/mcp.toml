# legacy out-of-schema source marker retained for traceability
#version = 1

# Global MCP server definitions only. Bundle-scoped endpoints belong in `resources/plugins/manifest.json`.
# Per-user enabled defaults belong in `config/usr/apps.toml`; installer rendering writes `$CODEX_HOME`
# `mcp_servers` as inline entries sorted with `url` transports first, then `command` transports.

#[mcp_servers.shell-tool]
#command = "/data/devops/nodejs/current/bin/npx"
#args = ["-y", "@openai/codex"]
#enabled = true

#[mcp_servers.shell-tool.env]
#PATH = "/data/devops/nodejs/current/bin:/usr/local/bin:/usr/bin:/bin"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
required = false
enabled_tools = [
  "fetch_openai_doc",
  "get_openapi_spec",
  "list_api_endpoints",
  "list_openai_docs",
  "search_openai_docs",
]
#scopes = [
#  "*",
#]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
required = false
# Official Linear docs describe capabilities, but do not publish a canonical
# machine-readable tool ID list. Leave `enabled_tools` unset so the server
# continues to expose its full toolset instead of risking a broken allow-list.
#scopes = [
#  "*",
#]
startup_timeout_sec = 20
tool_timeout_sec = 120
# OAuth login is supported in compatible clients.
# Optional bearer-token/API-key fallback:
bearer_token_env_var = "LINEAR_API_KEY"

