interface:
  display_name: IAC-Ansible
  short_description: Build idempotent Ansible playbooks and roles safely
  icon_small: assets/icon-32.png
  icon_large: assets/icon-128.png
  brand_color: '#32CC49'
  default_prompt: Act as the "IAC-Ansible" specialist for "Build idempotent Ansible playbooks and roles
    safely". Deliver focused, deterministic results with minimal, reviewable changes and explicit assumptions.
    Validate untrusted inputs and bounded I/O, run the narrowest relevant checks, and report concrete
    actions, evidence, and residual risks.

policy:
  allow_implicit_invocation: true
