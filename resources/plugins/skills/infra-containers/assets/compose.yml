name: app

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: "${APP_UID:?set APP_UID in .env (use ./rootless_env.sh --dotenv > .env)}"
        APP_GID: "${APP_GID:?set APP_GID in .env (use ./rootless_env.sh --dotenv > .env)}"
        APP_HOME: "${APP_HOME:-/app}"
    ports:
      - "${APP_PORT:-8080}:8080"
    # Match engine UID/GID when bind-mounting source code.
    user: "${APP_UID:?set APP_UID in .env (use ./rootless_env.sh --dotenv > .env)}:${APP_GID:?set APP_GID in .env (use ./rootless_env.sh --dotenv > .env)}"
    environment:
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
    internal: false
