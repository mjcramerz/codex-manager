# Rust release-delivery scaffold for GitLab -> GitHub sync plus optional GitLab package publishing.
# Shared includes are sourced from GL_CICD_SHARED_PROJ.

workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /(^|.*[^0-9])[0-9]{1,10}$/'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "mcr/release" && $GH_RELEASE_PUSH =~ /^(true|TRUE|1|yes|YES|y|Y|on|ON)$/'
    - when: never

stages:
  - verify
  - test
  - github-sync
  - gitlab-release
  - gitlab-cleanup

include:
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/rustc/verify.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/rustc/test.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/github/validate.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/github/push.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/gitlab/validate.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/gitlab/release.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/rustc/release-build.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/gitlab/cleanup.yml'

variables:
  GH_RELEASE_PUSH: 'true'
  GH_FORCE_PUSH: 'true'
  GH_PUBLIC_REPO: ''

  APPEND_VERSION: 'true'
  RELEASE_VERSION: '0.0.0'
  VERSION_BUMP_SCRIPT: 'scripts/release/bump_version.py'
  VERSION_BUMP_ARGS: '--version'

  APPLY_PATCHES: 'true'
  APPLY_PATCHES_EXCLUDE: ''
  # Shared patch helpers currently enforce these defaults; keep vars declared for visibility.
  PATCH_RELEASE_DIR: 'patches/release'
  PATCH_SERIES_FILE: 'patches/release/series'

  GL_RELEASE_ASSET: 'true'
  GL_CICD_RUNNER_BUILD: '${GL_CICD_RUNNER_RUST}'
  GL_CICD_RUNNER_RELEASE: '${GL_CICD_RUNNER_GLAB}'
  GL_RELEASE_TARGET: 'x86_64-unknown-linux-gnu'
  GL_RELEASE_CARGO_MANIFEST: 'Cargo.toml'
  GL_RELEASE_ARTIFACT_PREFIX: 'CHANGE_ME'
  GL_RELEASE_PACKAGE_NAME: 'CHANGE_ME'
  GL_RELEASE_CARGO_EXCLUDES: ''

  RELEASE_BINS: |
    CHANGE_ME
  CARGO_TEST_FLAGS: '--manifest-path Cargo.toml'
  CARGO_BUILD_FLAGS: '--manifest-path Cargo.toml'
  CARGO_FMT_FLAGS: '--manifest-path Cargo.toml --all --check'
  CARGO_CLIPPY_FLAGS: '--manifest-path Cargo.toml --all-targets --all-features -- -D warnings'

# Required protected variables/secrets:
# - GH_ORG_RELEASE
# - GH_ORG_RELEASE_APP_ID
# - GH_ORG_RELEASE_APP_PEM
# - GH_ORG_RELEASE_APP_INSTALL_ID
# - GL_GROUP_TOP_RELEASE
# - GL_PAT_RELEASE_TOKEN
# Pair with `.github/workflows/release-*.yml` pinned to shared
# `mattycramer/gh-actions/.github/workflows/release-from-workflow-run.yml`
# so release publishing always runs shared security gates before publish.
# Keep release mutation order deterministic: checkout -> true sync -> version bump -> patch apply -> push.
