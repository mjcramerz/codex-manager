stages:
  - verify
  - test
  - build

variables:
  NODE_IMAGE: 'node:20-bookworm@sha256:CHANGE_ME'
  NPM_CONFIG_CACHE: '${CI_PROJECT_DIR}/.npm'
  GIT_STRATEGY: fetch
  GIT_DEPTH: '50'

cache:
  key: "npm-${CI_COMMIT_REF_SLUG}"
  paths:
    - .npm

.rules: &rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "mcr/staging"'
    - if: '$CI_COMMIT_BRANCH == "mcr/release"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG'
    - when: never

default:
  image: '${NODE_IMAGE}'
  interruptible: true
  before_script:
    - set -eu
    - (set -o pipefail 2>/dev/null) || true
    - |
      if [ -f package-lock.json ]; then
        npm ci
      else
        npm install
      fi

lint:
  <<: *rules
  stage: verify
  script:
    - npm run lint --if-present

test:
  <<: *rules
  stage: test
  script:
    - npm test --if-present

build:
  <<: *rules
  stage: build
  script:
    - npm run build --if-present
