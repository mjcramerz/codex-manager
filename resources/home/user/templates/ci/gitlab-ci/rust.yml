stages:
  - verify
  - test

variables:
  RUST_IMAGE: 'rust:1.78-slim-bookworm@sha256:CHANGE_ME'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: '${CI_PROJECT_DIR}/.cargo'
  RUSTUP_HOME: '${CI_PROJECT_DIR}/.rustup'
  GIT_STRATEGY: fetch
  GIT_DEPTH: '50'

cache:
  key: "cargo-${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/registry
    - .cargo/git
    - target

.rules: &rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "mcr/staging"'
    - if: '$CI_COMMIT_BRANCH == "mcr/release"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG'
    - when: never

default:
  image: '${RUST_IMAGE}'
  interruptible: true
  before_script:
    - set -eu
    - (set -o pipefail 2>/dev/null) || true

fmt:
  <<: *rules
  stage: verify
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

clippy:
  <<: *rules
  stage: verify
  script:
    - rustup component add clippy
    - cargo clippy --all-targets --all-features -- -D warnings

test:
  <<: *rules
  stage: test
  script:
    - |
      if [ -f Cargo.lock ]; then
        cargo test --all-features --locked
      else
        cargo test --all-features
      fi
