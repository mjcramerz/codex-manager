########## Account configuration ##########
# Root and installer account credentials (use hashed passwords).
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Installer
d-i passwd/username string installer
d-i passwd/user-password-crypted password __SHA512_HASH__

# Optional: allow weak passwords in throwaway images only.
# d-i user-setup/allow-password-weak boolean true
