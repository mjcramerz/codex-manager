[project]
name = "python_cli_template"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
description = "Python CLI template"

[project.scripts]
cli-app = "cli_app.__main__:main_cli"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
