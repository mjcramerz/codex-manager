[package]
name = "axum_api_template"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Axum API template"

[dependencies]
anyhow = "1.0"
axum = "0.7"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "timeout", "trace"] }

[dev-dependencies]
# (none)
