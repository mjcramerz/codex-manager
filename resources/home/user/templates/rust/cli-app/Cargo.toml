[package]
name = "rust_cli_template"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust CLI template"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
assert_cmd = "2.0"
