.rules: &rules
  rules:
    # Tracked github/mcr mirrors are sync-only; skip direct pipeline runs.
    - if: '$CI_COMMIT_BRANCH =~ /^github\/mcr\/(main|staging)$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "mcr/staging"'
    - if: '$CI_COMMIT_BRANCH == "mcr/release"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG'
    - when: never
